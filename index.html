<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSD Solutions — HGV & Logistics Services</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    :root {
      --primary: #1a365d; --accent: #2e8b57; --danger: #dc3545;
      --warning: #f59e0b; --info: #3b82f6; --light: #f5f7fa;
      --card: #ffffff; --text: #333333; --muted: #6b7280;
      --border: #e5e7eb;
    }
    body { background: var(--light); min-height: 100vh; color: var(--text); }
    .page { display: none; min-height: 100vh; }
    .active { display: block !important; }

    .container { max-width: 440px; margin: 0 auto; padding: 40px 24px; }
    .logo { text-align: center; margin-bottom: 40px; }
    .logo h1 { font-size: 28px; color: var(--primary); margin-bottom: 4px; }
    .logo p { color: var(--muted); font-size: 15px; }
    h2 { font-size: 22px; color: var(--primary); margin-bottom: 24px; text-align: center; }
    h3 { font-size: 16px; color: var(--primary); margin: 24px 0 10px; }
    h4 { font-size: 15px; color: var(--primary); margin: 16px 0 8px; }
    input, select, textarea {
      width: 100%; padding: 14px 16px; margin-bottom: 14px;
      border: 1px solid var(--border); border-radius: 8px; font-size: 16px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,54,93,0.1);
    }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; margin-bottom: 12px; }
    .btn-accent { background: var(--accent); color: white; margin-bottom: 12px; }
    .btn-danger { background: var(--danger); color: white; margin-top: 20px; }
    .btn-warning { background: var(--warning); color: #1f2937; margin-bottom: 12px; }
    .btn-sm { width: auto; padding: 8px 16px; font-size: 14px; }
    .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); }
    .link-row { text-align: center; margin-top: 20px; font-size: 15px; }
    a { color: var(--primary); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .status { text-align: center; margin-top: 30px; color: var(--muted); font-size: 15px; }

    .dash-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .dash-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    .dash-header h1 { font-size: 24px; color: var(--primary); }
    .dash-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .dash-nav button {
      width: auto; padding: 10px 16px; background: white; color: var(--text);
      border: 1px solid var(--border); font-size: 14px; margin: 0;
    }
    .dash-nav button.active {
      background: var(--primary); color: white; border-color: var(--primary);
    }
    .dash-content { animation: fadeIn 0.3s; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card {
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card h3 { margin: 0 0 4px; font-size: 24px; }
    .card p { color: var(--muted); font-size: 14px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    .checklist-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .checklist-item input[type="checkbox"] { width: auto; margin: 0; }
    .defect-box { background: #fef3c7; padding: 16px; border-radius: 8px; margin: 12px 0; }
    .thumb-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .thumb-grid img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 4px;
      cursor: pointer; border: 1px solid var(--border);
    }
    .item-card {
      background: white; padding: 16px; border-radius: 10px; margin-bottom: 12px;
      border-left: 4px solid var(--accent);
    }
    .item-card.major { border-left-color: var(--danger); }
    .item-card.advisory { border-left-color: var(--warning); }
    .item-card.info { border-left-color: var(--info); }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-blue { background: #dbeafe; color: #1e40af; }

    table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: var(--light); font-weight: 600; color: var(--primary); }
    tr:hover { background: #f9fafb; }

    .cal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    }
    .cal-day {
      aspect-ratio: 1; padding: 6px; border-radius: 6px;
      background: white; border: 1px solid var(--border);
      min-height: 70px; cursor: pointer;
    }
    .cal-day:hover { background: #f0f4f8; }
    .cal-day.today { border-color: var(--primary); border-width: 2px; }
    .key-box { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .key-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .key-swatch { width: 14px; height: 14px; border-radius: 3px; }
    .avail-bg { background: #d1fae5; }
    .unavail-bg { background: #fee2e2; }
    .booked-bg { background: #dbeafe; }

    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .mt-20 { margin-top: 20px; }
    .mb-20 { margin-bottom: 20px; }
    .alert { padding: 12px 16px; border-radius: 8px; margin: 16px 0; }
    .alert-info { background: #e0f2fe; color: #075985; }
    .alert-success { background: #dcfce7; color: #166534; }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    details { margin-top: 8px; }
    summary { cursor: pointer; font-size: 13px; color: var(--primary); }
  </style>
</head>
<body>

<div id="page-signin" class="page active">
  <div class="container">
    <div class="logo">
      <h1>LSD Solutions</h1>
      <p>HGV & Logistics Services</p>
    </div>
    <h2>Sign In</h2>
    <input type="email" id="si-email" placeholder="Email address" />
    <input type="password" id="si-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleSignIn()">Sign In</button>
    <div class="link-row">
      Don't have an account? <a href="#" onclick="showPage('register'); return false;">Register here</a>
    </div>
  </div>
</div>

<div id="page-register" class="page">
  <div class="container">
    <div class="logo"><h1>LSD Solutions</h1></div>
    <h2>Create Account</h2>
    <h3>Register as a Company</h3>
    <input type="text" id="reg-name" placeholder="Company name" />
    <input type="email" id="reg-email" placeholder="Email address" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleCompanyRegister()">Register as Company</button>
    <h3>Register as a Driver</h3>
    <input type="text" id="dr-name" placeholder="Your full name" />
    <input type="email" id="dr-email" placeholder="Email address" />
    <input type="password" id="dr-password" placeholder="Password" />
    <button class="btn-accent" onclick="handleDriverRegister()">Register as Driver</button>
    <div class="link-row">
      <a href="#" onclick="showPage('signin'); return false;">← Back to Sign In</a>
    </div>
  </div>
</div>

<div id="page-loading" class="page">
  <div class="container" style="text-align: center; padding-top: 80px;">
    <h2>Loading...</h2>
    <p id="status-text" class="status">Checking session...</p>
  </div>
</div>

<div id="page-dashboard" class="page">
  <div class="dash-container">
    <div class="dash-header">
      <div>
        <h1 id="dash-title">Dashboard</h1>
        <p id="dash-subtitle" style="color: var(--muted); font-size: 14px;">Welcome</p>
      </div>
      <button class="btn-sm btn-danger" onclick="handleSignOut()">Sign Out</button>
    </div>
    <div class="dash-nav" id="dash-nav"></div>
    <div class="dash-content" id="dash-content"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD1futajZiZd79r08a8TJHAMfgtpPPk0rk",
    authDomain: "lsd-solutions.firebaseapp.com",
    projectId: "lsd-solutions",
    storageBucket: "lsd-solutions.appspot.com",
    messagingSenderId: "833767217116",
    appId: "1:833767217116:web:b29188de76b5778a086119",
    measurementId: "G-7YF4T8BBPT"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  let currentUser = null;
  let userProfile = null;
  let calDate = new Date();
  let availData = {}, jobsData = [], checksData = [], defectsData = [], usersData = [];
  let selectedPhotoFiles = [];

  const pages = {
    signin: document.getElementById('page-signin'),
    register: document.getElementById('page-register'),
    loading: document.getElementById('page-loading'),
    dashboard: document.getElementById('page-dashboard')
  };

  function showPage(name) {
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[name].classList.add('active');
  }
  function setStatus(msg) { console.log('📢', msg); document.getElementById('status-text').textContent = msg; }

  function getNavItems(role) {
    return role === 'company'
      ? [ {id:'drivers',label:'👥 Drivers'}, {id:'vehicles',label:'🚛 Vehicle Checks'}, {id:'work',label:'📤 Post Work'}, {id:'calendar',label:'📅 Calendar'}, {id:'docs',label:'📄 Documents'}, {id:'profile',label:'👤 Profile'} ]
      : [ {id:'check',label:'✅ Vehicle Check'}, {id:'mychecks',label:'📋 My Checks'}, {id:'calendar',label:'📅 My Calendar'}, {id:'work',label:'🔍 Available Work'}, {id:'docs',label:'📄 My Documents'}, {id:'profile',label:'👤 My Profile'} ];
  }

  function renderNav(role) {
    document.getElementById('dash-nav').innerHTML = getNavItems(role).map(i =>
      `<button data-nav="${i.id}" onclick="switchTab('${i.id}')">${i.label}</button>`
    ).join('');
  }

  function switchTab(tabId) {
    document.querySelectorAll('.dash-nav button').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-nav="${tabId}"]`)?.classList.add('active');
    renderContent(tabId);
  }

  async function uploadDefectPhoto(file, userId) {
    const ref = storage.ref(`defects/${userId}/${Date.now()}_${file.name}`);
    await ref.put(file);
    return await ref.getDownloadURL();
  }

  async function loadAllData() {
    if (!currentUser) return;
    const [availSnap, checksSnap, defectsSnap, jobsSnap, usersSnap] = await Promise.all([
      db.collection('availability').where('userId','==',currentUser.uid).get(),
      db.collection('checks').orderBy('completedAt','desc').limit(50).get(),
      db.collection('defects').orderBy('timestamp','desc').limit(50).get(),
      db.collection('jobs').orderBy('createdAt','desc').limit(50).get(),
      db.collection('users').limit(50).get()
    ]);
    availData = {}; availSnap.forEach(d => availData[d.data().date] = d.data());
    checksData = checksSnap.docs.map(d => ({id:d.id, ...d.data()}));
    defectsData = defectsSnap.docs.map(d => ({id:d.id, ...d.data()}));
    jobsData = jobsSnap.docs.map(d => ({id:d.id, ...d.data()}));
    usersData = usersSnap.docs.map(d => ({id:d.id, ...d.data()}));
  }

  function renderContent(tab) {
    const role = userProfile?.role || 'driver';
    const dashContent = document.getElementById('dash-content');
    switch(tab) {
      case 'check': return dashContent.innerHTML = renderVehicleCheck();
      case 'mychecks': return dashContent.innerHTML = renderMyChecks();
      case 'work': return dashContent.innerHTML = role==='company' ? renderCompanyWork() : renderAvailableWork();
      case 'calendar': return dashContent.innerHTML = renderCalendar();
      case 'docs': return dashContent.innerHTML = renderDocuments();
      case 'profile': return dashContent.innerHTML = renderProfile();
      case 'drivers': return dashContent.innerHTML = renderCompanyDrivers();
      case 'vehicles': return dashContent.innerHTML = renderCompanyVehicles();
    }
  }

  function renderVehicleCheck() {
    return `
      <h3>Daily Vehicle Walkaround Check</h3>
      <p style="color:var(--muted); margin-bottom:20px;">Complete before starting your shift</p>
      <div class="form-group"><label>Vehicle Registration</label><input type="text" id="vreg" placeholder="e.g. AB12 CDE" /></div>
      <h3>Checklist Items</h3>
      ${['Tyres & Wheels','Brakes','Lights & Indicators','Mirrors','Windscreen & Wipers','Fluid Levels (Oil, Coolant, Screenwash)','Fuel Caps & Security','Coupling / Fifth Wheel','Body & Exterior','Number Plates','Horns & Warning Devices','Tachograph Equipment','Fire Extinguisher & First Aid','Load Security / Doors'].map(item => `
        <div class="checklist-item">
          <input type="checkbox" id="check-${item.replace(/\s+/g,'-')}" />
          <label for="check-${item.replace(/\s+/g,'-')}">${item}</label>
          <button class="btn-sm btn-warning" style="margin-left:auto; width:auto; padding:4px 8px; font-size:12px;" onclick="showDefect('${item}')">Report Defect</button>
        </div>`).join('')}
      <div id="defect-form" class="hidden mt-20">
        <div class="defect-box">
          <h4>Report Defect</h4>
          <input type="text" id="defect-item" placeholder="Defect / Component" />
          <textarea id="defect-desc" rows="3" placeholder="Describe the issue in detail..." style="resize:none;"></textarea>
          <label>Severity</label>
          <select id="defect-severity">
            <option value="advisory">⚠️ Advisory</option>
            <option value="major">🔴 Major — Immediate attention</option>
          </select>
          <label>Add Photos</label>
          <input type="file" id="defect-photos" accept="image/*" multiple onchange="showPhotoPreviews(this)" />
          <div id="photo-preview-area" class="thumb-grid"></div>
          <button class="btn-primary mt-20" id="save-defect-btn" onclick="saveDefect()">📸 Save Defect</button>
          <button class="btn-sm" style="background:transparent; color:var(--muted);" onclick="hideDefect()">Cancel</button>
        </div>
      </div>
      <h3 style="margin-top:30px;">Other Defects</h3>
      <button class="btn-accent" onclick="showOtherDefect()">Add Any Other Defect</button>
      <button class="btn-primary mt-20" onclick="submitCheck()">✅ Submit Completed Check</button>
    `;
  }

  function showPhotoPreviews(input) {
    selectedPhotoFiles = Array.from(input.files);
    const area = document.getElementById('photo-preview-area');
    area.innerHTML = '';
    selectedPhotoFiles.forEach(f => {
      const r = new FileReader(); r.onload = e => area.innerHTML += `<img src="${e.target.result}" alt="Preview" />`; r.readAsDataURL(f);
    });
  }

  function showDefect(item) {
    selectedPhotoFiles = [];
    document.getElementById('defect-item').value = item || '';
    document.getElementById('photo-preview-area').innerHTML = '';
    document.getElementById('defect-form').classList.remove('hidden');
  }
  function showOtherDefect() { showDefect(null); document.getElementById('defect-item').placeholder = 'Enter defect name'; }
  function hideDefect() { document.getElementById('defect-form').classList.add('hidden'); selectedPhotoFiles = []; }

  async function saveDefect() {
    const item = document.getElementById('defect-item').value.trim() || 'Unspecified';
    const desc = document.getElementById('defect-desc').value.trim();
    const severity = document.getElementById('defect-severity').value;
    if (!desc) return alert('Please describe the defect');
    const btn = document.getElementById('save-defect-btn');
    btn.disabled = true; btn.textContent = '⏳ Uploading...';
    const photoURLs = [];
    for (const f of selectedPhotoFiles) photoURLs.push(await uploadDefectPhoto(f, currentUser.uid));
    await db.collection('defects').add({
      userId: currentUser.uid, userName: userProfile.name, item, description: desc, severity, photoURLs,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert(`✅ Defect saved — ${photoURLs.length} photo(s) uploaded`);
    hideDefect(); btn.disabled = false; btn.textContent = '📸 Save Defect';
    await loadAllData(); renderContent('mychecks');
  }

  async function submitCheck() {
    const reg = document.getElementById('vreg').value.trim() || 'Not Recorded';
    const checkedItems = [];
    document.querySelectorAll('.checklist-item input:checked').forEach(cb =>
      checkedItems.push(cb.id.replace('check-','').replace(/-/g,' '))
    );
    await db.collection('checks').add({
      userId: currentUser.uid, userName: userProfile.name, vehicleReg: reg, checkedItems,
      completedAt: firebase.firestore.FieldValue.serverTimestamp(), status: 'submitted'
    });
    alert('✅ Check submitted');
    renderContent('check');
  }

  function renderMyChecks() {
    const myChecks = checksData.filter(c => c.userId === currentUser.uid);
    const myDefects = defectsData.filter(d => d.userId === currentUser.uid);
    let html = `<h3>My Checks (Last 50)</h3>`;
    if (!myChecks.length) html += `<p class="empty">No checks submitted yet.</p>`;
    else myChecks.forEach(c => {
      const date = c.completedAt?.toDate ? c.completedAt.toDate().toLocaleString() : 'Recently';
      html += `<div class="item-card info"><strong>🚛 ${c.vehicleReg||'Vehicle'}</strong><p style="font-size:13px; color:var(--muted);">${date}</p><p>${c.checkedItems?.length||0} items checked</p></div>`;
    });
    html += `<h3 style="margin-top:30px;">Reported Defects</h3>`;
    if (!myDefects.length) html += `<p class="empty">No defects — all good ✅</p>`;
    else myDefects.forEach(d => {
      const date = d.timestamp?.toDate ? d.timestamp.toDate().toLocaleString() : 'Recently';
      html += `<div class="item-card ${d.severity==='major'?'major':'advisory'}">
        <strong>${d.severity==='major'?'🔴':'⚠️'} ${d.item}</strong>
        <p style="font-size:13px; color:var(--muted);">${date}</p>
        <p>${d.description}</p>
        ${d.photoURLs?.length ? `<div class="thumb-grid">${d.photoURLs.map(u=>`<a href="${u}" target="_blank"><img src="${u}" /></a>`).join('')}</div>` : ''}
      </div>`;
    });
    return html;
  }

  function renderCompanyDrivers() {
    const drivers = usersData.filter(u => u.role === 'driver');
    let html = `<h3>👥 Driver Management</h3><p class="alert alert-info">All registered drivers — view checks, defects & availability</p>`;
    if (!drivers.length) {
      html += `<p class="empty">No drivers registered yet. They will appear here when they sign up.</p>`;
    } else {
      html += `<table><thead><tr><th>Name</th><th>Email</th><th>Checks</th><th>Defects</th><th>Status</th><th class="text-right">View</th></tr></thead><tbody>`;
      drivers.forEach(d => {
        const dc = checksData.filter(c => c.userId === d.id).length;
        const dd = defectsData.filter(def => def.userId === d.id).length;
        html += `<tr><td><strong>${d.name||'Unnamed'}</strong></td><td style="font-size:13px; color:var(--muted);">${d.email}</td><td>${dc}</td><td>${dd}</td><td><span class="status-badge badge-green">Active</span></td><td class="text-right"><button class="btn-sm btn-outline" onclick="viewDriverDetail('${d.id}')">Details</button></td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `<div id="driver-detail-view" class="hidden mt-20"><h3>Driver Details</h3><div id="driver-detail-content"></div></div>`;
    return html;
  }

  window.viewDriverDetail = async function(driverId) {
    await loadAllData();
    const driver = usersData.find(u => u.id === driverId);
    const dc = checksData.filter(c => c.userId === driverId).slice(0,10);
    const dd = defectsData.filter(d => d.userId === driverId).slice(0,10);
    const content = document.getElementById('driver-detail-content');
    content.innerHTML = `
      <div class="card" style="margin-bottom:20px;"><h4>${driver?.name}</h4><p style="color:var(--muted);">${driver?.email}</p></div>
      <h4>Last 10 Checks</h4>
      ${!dc.length?'<p class="empty">No checks yet</p>':dc.map(c=>{
        const date = c.completedAt?.toDate ? c.completedAt.toDate().toLocaleString() : 'Recently';
        return `<div class="item-card info"><strong>🚛 ${c.vehicleReg||'Vehicle'}</strong><p style="font-size:13px; color:var(--muted);">${date}</p><p>${c.checkedItems?.length||0} items checked</p></div>`;
      }).join('')}
      <h4 style="margin-top:30px;">Reported Defects</h4>
      ${!dd.length?'<p class="empty">No defects ✅</p>':dd.map(d=>{
        const date = d.timestamp?.toDate ? d.timestamp.toDate().toLocaleString() : 'Recently';
        return `<div class="item-card ${d.severity==='major'?'major':'advisory'}">
          <strong>${d.severity==='major'?'🔴':'⚠️'} ${d.item}</strong><p style="font-size:13px; color:var(--muted);">${date}</p><p>${d.description}</p>
          ${d.photoURLs?.length?`<div class="thumb-grid">${d.photoURLs.map(u=>`<a href="${u}" target="_blank"><img src="${u}" /></a>`).join('')}</div>`:''}
        </div>`;
      }).join('')}
      <button class="btn-sm" style="margin-top:20px; background:transparent; color:var(--muted);" onclick="document.getElementById('driver-detail-view').classList.add('hidden')">Close</button>
    `;
    document.getElementById('driver-detail-view').classList.remove('hidden');
  };

  function renderCompanyVehicles() {
    const vehicleMap = {};
    checksData.forEach(c => {
      const reg = (c.vehicleReg || 'UNKNOWN').toUpperCase();
      if (!vehicleMap[reg]) vehicleMap[reg] = {checks:[], drivers:new Set()};
      vehicleMap[reg].checks.push(c);
      vehicleMap[reg].drivers.add(c.userName || 'Unknown');
    });
    let html = `<h3>🚛 Vehicle Checks Overview</h3><p class="alert alert-info">All walkaround checks submitted by your drivers</p>
      <div class="grid">
        <div class="card"><h3>${checksData.length}</h3><p>Total Checks</p></div>
        <div class="card"><h3>${defectsData.filter(d=>d.severity==='major').length}</h3><p>🔴 Major Defects</p></div>
        <div class="card"><h3>${defectsData.filter(d=>d.severity==='advisory').length}</h3><p>⚠️ Advisory Items</p></div>
        <div class="card"><h3>${Object.keys(vehicleMap).length}</h3><p>Vehicles Active</p></div>
      </div>
      <h3>Checks by Vehicle</h3>
    `;
    if (!Object.keys(vehicleMap).length) {
      html += `<p class="empty">No checks submitted yet. Data will appear here.</p>`;
    } else {
      html += `<table><thead><tr><th>Vehicle Reg</th><th>Total Checks</th><th>Last Checked</th><th>Drivers</th><th class="text-right">View</th></tr></thead><tbody>`;
      Object.entries(vehicleMap).forEach(([reg, data]) => {
        const sorted = data.checks.sort((a,b)=> (b.completedAt?.toDate?.getTime()||0) - (a.completedAt?.toDate?.getTime()||0));
        const lastDate = sorted[0]?.completedAt?.toDate ? sorted[0].completedAt.toDate().toLocaleString() : 'Recently';
        html += `<tr><td><strong>${reg}</strong></td><td>${data.checks.length}</td><td style="font-size:13px;">${lastDate}</td><td style="font-size:13px;">${Array.from(data.drivers).join(', ')}</td><td class="text-right"><button class="btn-sm btn-outline" onclick="viewVehicleChecks('${reg}')">View All</button></td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `<h3 style="margin-top:40px;">All Reported Defects</h3>`;
    if (!defectsData.length) html += `<p class="empty">No defects reported ✅</p>`;
    else defectsData.forEach(d => {
      const date = d.timestamp?.toDate ? d.timestamp.toDate().toLocaleString() : 'Recently';
      html += `<div class="item-card ${d.severity==='major'?'major':'advisory'}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div><strong>${d.severity==='major'?'🔴':'⚠️'} ${d.item}</strong><p style="font-size:13px; color:var(--muted); margin:4px 0;">Reported by: ${d.userName||'Unknown'} — ${date}</p><p>${d.description}</p></div>
          <span class="status-badge ${d.severity==='major'?'badge-red':'badge-yellow'}">${d.severity.toUpperCase()}</span>
        </div>
        ${d.photoURLs?.length?`<div class="thumb-grid" style="margin-top:10px;">${d.photoURLs.map(u=>`<a href="${u}" target="_blank"><img src="${u}" /></a>`).join('')}</div>`:''}
      </div>`;
    });
    html += `<div id="vehicle-checks-view" class="hidden mt-20"><h3>Vehicle Check History</h3><div id="vehicle-checks-content"></div></div>`;
    return html;
  }

  window.viewVehicleChecks = async function(reg) {
    await loadAllData();
    const checks = checksData.filter(c => (c.vehicleReg||'UNKNOWN').toUpperCase() === reg)
      .sort((a,b)=> (b.completedAt?.toDate?.getTime()||0) - (a.completedAt?.toDate?.getTime()||0));
    const content = document.getElementById('vehicle-checks-content');
    content.innerHTML = `<h4>Vehicle: ${reg}</h4><p style="color:var(--muted); margin-bottom:20px;">${checks.length} checks submitted</p>` +
      checks.map(c => {
        const date = c.completedAt?.toDate ? c.completedAt.toDate().toLocaleString() : 'Recently';
        return `<div class="item-card info">
          <p style="font-size:13px; color:var(--muted); margin-bottom:8px;"><strong>${c.userName||'Unknown Driver'}</strong> — ${date}</p>
          <p style="font-size:13px;">${c.checkedItems?.length||0} items checked</p>
          <details><summary>View checklist</summary><ul style="margin-top:8px; padding-left:20px; font-size:13px;">${(c.checkedItems||[]).map(i=>`<li>✅ ${i}</li>`).join('')}</ul></details>
        </div>`;
      }).join('') +
      `<button class="btn-sm" style="margin-top:20px; background:transparent; color:var(--muted);" onclick="document.getElementById('vehicle-checks-view').classList.add('hidden')">Close</button>`;
    document.getElementById('vehicle-checks-view').classList.remove('hidden');
  };

  function renderCalendar() {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const firstDay = new Date(y,m,1).getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    const isDriver = userProfile?.role !== 'company';
    return `
      <h3>${isDriver ? 'My Calendar' : 'Company Calendar Overview'}</h3>
      <div class="key-box">
        <div class="key-item"><span class="key-swatch avail-bg"></span> Available</div>
        <div class="key-item"><span class="key-swatch unavail-bg"></span> Unavailable</div>
        <div class="key-item"><span class="key-swatch booked-bg"></span> Work Booked</div>
      </div>
      <div class="cal-header">
        <button class="btn-sm" onclick="changeCal(-1)">←</button>
        <span style="font-weight:600;">${mNames[m]} ${y}</span>
        <button class="btn-sm" onclick="changeCal(1)">→</button>
      </div>
      <div class="cal-grid">
        ${days.map(d=>`<div style="text-align:center; font-weight:600; padding:8px; font-size:13px;">${d}</div>`).join('')}
        ${Array(firstDay).fill('').map(()=>'<div></div>').join('')}
        ${Array.from({length:daysInMonth}, (_,i) => {
          const d = i+1;
          const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const status = availData[dateStr]?.status;
          const isToday = new Date().toDateString() === new Date(y,m,d).toDateString();
          let bg = '';
          if (status==='available') bg='avail-bg';
          else if (status==='unavailable') bg='unavail-bg';
          else if (status==='booked') bg='booked-bg';
          return `<div class="cal-day ${isToday?'today':''} ${bg}" ${isDriver?`onclick="setAvail('${dateStr}')"`:""}>
            <strong>${d}</strong>${status?`<div style="font-size:10px; margin-top:4px;">${status}</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <p style="margin-top:16px; font-size:13px; color:var(--muted);">
        ${isDriver?'Click any day to set your availability':'Driver availability will appear here'}
      </p>
    `;
  }
  window.changeCal = dir => { calDate.setMonth(calDate.getMonth()+dir); renderContent('calendar'); };
  window.setAvail = async dateStr => {
    const choice = prompt(`Set status for ${dateStr}:\n- available\n- unavailable\n- booked`);
    if (!['available','unavailable','booked'].includes(choice)) return;
    await db.collection('availability').doc(`${currentUser.uid}_${dateStr}`).set({userId:currentUser.uid, date:dateStr, status:choice}, {merge:true});
    await loadAllData(); renderContent('calendar'); alert(`✅ Set to: ${choice}`);
  };

  function renderAvailableWork() {
    const open = jobsData.filter(j => j.status === 'open');
    if (!open.length) return `<h3>Available Work</h3><p class="alert alert-info">No jobs posted yet. Check back soon!</p>`;
    return `<h3>Available Work — ${open.length} job${open.length!==1?'s':''}</h3>` + open.map(j => `
      <div class="item-card">
        <strong style="font-size:16px;">${j.title||'Untitled Job'}</strong>
        <p style="color:var(--muted); font-size:13px; margin:4px 0;">Posted by: ${j.companyName||'Company'}</p>
        <p><strong>Date:</strong> ${j.date||'Not specified'}</p>
        <p><strong>Time:</strong> ${j.startTime||''} — ${j.endTime||''}</p>
        <p><strong>Pay:</strong> £${j.pay||'Negotiable'}</p>
        ${j.description?`<p style="margin-top:8px;">${j.description}</p>`:''}
        <button class="btn-accent btn-sm" style="margin-top:12px; width:auto;">Apply / Enquire</button>
      </div>
    `).join('');
  }

  function renderCompanyWork() {
    const myJobs = jobsData.filter(j => j.companyId === currentUser?.uid);
    return `
      <h3>Post New Work</h3>
      <div class="form-group"><label>Job Title / Route</label><input type="text" id="job-title" placeholder="e.g. Manchester — Southampton" /></div>
      <div class="form-group"><label>Date</label><input type="date" id="job-date" /></div>
      <div class="form-group"><label>Start Time</label><input type="time" id="job-start" /></div>
      <div class="form-group"><label>End Time</label><input type="time" id="job-end" /></div>
      <div class="form-group"><label>Rate / Pay (£)</label><input type="text" id="job-pay" placeholder="e.g. 180" /></div>
      <div class="form-group"><label>Additional Details</label><textarea id="job-desc" rows="3" placeholder="Vehicle type, loads, requirements..."></textarea></div>
      <button class="btn-primary" onclick="postJob()">📤 Publish Job</button>
      <h3 style="margin-top:40px;">Your Posted Jobs</h3>
      ${!myJobs.length?'<p class="empty">No jobs posted yet</p>':myJobs.map(j=>`
        <div class="item-card">
          <strong>${j.title}</strong>
          <p>Date: ${j.date} | £${j.pay} | <span class="status-badge ${j.status==='open'?'badge-green':'badge-yellow'}">${j.status}</span></p>
          ${j.status==='open'?`<button class="btn-sm btn-danger" style="width:auto; margin-top:8px;" onclick="closeJob('${j.id}')">Mark Filled / Close</button>`:''}
        </div>
      `).join('')}
    `;
  }
  window.postJob = async () => {
    const title = document.getElementById('job-title').value.trim();
    const date = document.getElementById('job-date').value;
    if (!title || !date) return alert('Please enter title and date');
    await db.collection('jobs').add({
      companyId: currentUser.uid, companyName: userProfile.name, title,
      date, startTime: document.getElementById('job-start').value,
      endTime: document.getElementById('job-end').value,
      pay: document.getElementById('job-pay').value.trim(),
      description: document.getElementById('job-desc').value.trim(),
      status: 'open', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert('✅ Job posted'); await loadAllData(); renderContent('work');
  };
  window.closeJob = async id => {
    if (!confirm('Mark as filled? It will no longer appear to drivers.')) return;
    await db.collection('jobs').doc(id).update({status:'closed'});
    await loadAllData(); renderContent('work'); alert('✅ Job closed');
  };

  const docs = userProfile?.role==='company'
    ? [
        {id:'insurance', name:'Insurance Certificate', icon:'📄'},

        {id:'policies', name:'Policies & Procedures', icon:'📋'}

}

let docPhotoURLs = {};
function previewDocPhoto(input, previewId) {
  const previewArea = document.getElementById(previewId);
  previewArea.innerHTML = '';
  docPhotoURLs[previewId] = [];
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      previewArea.innerHTML = `<img src="${e.target.result}" alt="Preview" style="width:100px; height:100px; object-fit:cover; border-radius:4px; border:1px solid var(--border);" />`;
      docPhotoURLs[previewId].push(e.target.result);
    };
    reader.readAsDataURL(input.files[0]);
  }
}
