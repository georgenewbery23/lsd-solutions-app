<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSD Solutions — HGV & Logistics Services</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    :root { --primary: #1a365d; --accent: #2e8b57; --danger: #dc3545; --light: #f5f7fa; --card: #ffffff; --text: #333333; --muted: #6b7280; }
    body { background: var(--light); min-height: 100vh; color: var(--text); }
    .page { display: none; min-height: 100vh; }
    .container { max-width: 440px; margin: 0 auto; padding: 40px 24px; }
    .logo { text-align: center; margin-bottom: 40px; }
    .logo h1 { font-size: 28px; color: var(--primary); margin-bottom: 4px; }
    .logo p { color: var(--muted); font-size: 15px; }
    h2 { font-size: 22px; color: var(--primary); margin-bottom: 24px; text-align: center; }
    h3 { font-size: 16px; color: var(--primary); margin: 24px 0 10px; }
    input { width: 100%; padding: 14px 16px; margin-bottom: 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,54,93,0.1); }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.92; }
    .btn-primary { background: var(--primary); color: white; margin-bottom: 12px; }
    .btn-accent { background: var(--accent); color: white; margin-bottom: 12px; }
    .btn-danger { background: var(--danger); color: white; margin-top: 20px; }
    a { color: var(--primary); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .link-row { text-align: center; margin-top: 20px; font-size: 15px; }
    .status { text-align: center; margin-top: 30px; color: var(--muted); font-size: 15px; }
    .dashboard-container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
    .dashboard-header { margin-bottom: 30px; }
    .dashboard-header h1 { font-size: 26px; color: var(--primary); margin-bottom: 6px; }
    .dashboard-header p { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.09); }
    .card h3 { font-size: 18px; color: var(--primary); margin: 0 0 6px; }
    .card p { color: var(--muted); font-size: 14px; }
    .sign-out-btn { width: auto; display: inline-block; padding: 12px 26px; }
  </style>
</head>
<body>

<!-- SIGN IN PAGE -->
<div id="page-signin" class="page" style="display: block;">
  <div class="container">
    <div class="logo">
      <h1>LSD Solutions</h1>
      <p>HGV & Logistics Services</p>
    </div>
    <h2>Sign In</h2>
    <input type="email" id="si-email" placeholder="Email address" />
    <input type="password" id="si-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleSignIn()">Sign In</button>
    <div class="link-row">
      Don't have an account? <a href="#" onclick="showRegister(); return false;">Register here</a>
    </div>
  </div>
</div>

<!-- REGISTER PAGE -->
<div id="page-register" class="page">
  <div class="container">
    <div class="logo">
      <h1>LSD Solutions</h1>
    </div>
    <h2>Create Account</h2>

    <h3>Register as a Company</h3>
    <input type="text" id="reg-name" placeholder="Company name" />
    <input type="email" id="reg-email" placeholder="Email address" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleCompanyRegister()">Register as Company</button>

    <h3>Register as a Driver</h3>
    <input type="text" id="dr-name" placeholder="Your full name" />
    <input type="email" id="dr-email" placeholder="Email address" />
    <input type="password" id="dr-password" placeholder="Password" />
    <button class="btn-accent" onclick="handleDriverRegister()">Register as Driver</button>

    <div class="link-row">
      <a href="#" onclick="showSignIn(); return false;">← Back to Sign In</a>
    </div>
  </div>
</div>

<!-- LOADING PAGE -->
<div id="page-loading" class="page">
  <div class="container" style="text-align: center; padding-top: 80px;">
    <h2>Loading...</h2>
    <p id="status-text" class="status">Checking connection...</p>
  </div>
</div>

<!-- DASHBOARD PAGE -->
<div id="page-dashboard" class="page">
  <div id="dashboard-content"></div>
</div>

<!-- FIREBASE SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  // ✅ YOUR EXACT CONFIG FROM FIREBASE CONSOLE — UPDATED!
  const firebaseConfig = {
    apiKey: "AIzaSyD1futajZiZd79r08a8TJHAMfgtpPPk0rk",
    authDomain: "lsd-solutions.firebaseapp.com",
    projectId: "lsd-solutions",
    storageBucket: "lsd-solutions.firebasestorage.app",
    messagingSenderId: "833767217116",
    appId: "1:833767217116:web:b29188de76b5778a086119",
    measurementId: "G-7YF4T8BBPT"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let profileLoaded = false;

  const pageSignIn = document.getElementById('page-signin');
  const pageRegister = document.getElementById('page-register');
  const pageLoading = document.getElementById('page-loading');
  const pageDashboard = document.getElementById('page-dashboard');
  const dashboardContent = document.getElementById('dashboard-content');
  const statusText = document.getElementById('status-text');

  function showPage(pageToShow) {
    [pageSignIn, pageRegister, pageLoading, pageDashboard].forEach(p => {
      if (p) p.style.display = 'none';
    });
    if (pageToShow) pageToShow.style.display = 'block';
  }

  function setStatus(msg) {
    console.log('📢', msg);
    if (statusText) statusText.textContent = msg;
  }

  function getDashboardHTML(role) {
    if (role === 'company') {
      return `
        <div class="dashboard-container">
          <div class="dashboard-header">
            <h1>🏢 Company Portal</h1>
            <p>Welcome to LSD Solutions — Management Dashboard</p>
          </div>
          <div class="grid">
            <div class="card"><h3>🚛 Drivers</h3><p>Manage your driver list</p></div>
            <div class="card"><h3>📋 Vehicles</h3><p>Fleet & walkaround checks</p></div>
            <div class="card"><h3>📄 Documents</h3><p>Licences, CPC, tacho records</p></div>
            <div class="card"><h3>💰 Payments</h3><p>Invoices & transactions</p></div>
            <div class="card"><h3>📅 Calendar</h3><p>Jobs & availability</p></div>
            <div class="card"><h3>👤 Profile</h3><p>Company details & settings</p></div>
          </div>
          <button class="btn-danger sign-out-btn" onclick="handleSignOut()">Sign Out</button>
        </div>
      `;
    } else {
      return `
        <div class="dashboard-container">
          <div class="dashboard-header">
            <h1>🚛 Driver Portal</h1>
            <p>Welcome back — LSD Solutions</p>
          </div>
          <div class="grid">
            <div class="card"><h3>✅ Vehicle Check</h3><p>Daily walkaround</p></div>
            <div class="card"><h3>📋 My Checks</h3><p>History & defects</p></div>
            <div class="card"><h3>📅 My Calendar</h3><p>Work & availability</p></div>
            <div class="card"><h3>🔍 Available Work</h3><p>Jobs from operators</p></div>
            <div class="card"><h3>📄 My Documents</h3><p>Licence, CPC, tacho</p></div>
            <div class="card"><h3>👤 My Profile</h3><p>Personal info</p></div>
          </div>
          <button class="btn-danger sign-out-btn" onclick="handleSignOut()">Sign Out</button>
        </div>
      `;
    }
  }

  function showDashboard(role) {
    console.log('🖥️ Showing dashboard for role:', role);
    dashboardContent.innerHTML = getDashboardHTML(role);
    showPage(pageDashboard);
  }

  async function loadProfile(user) {
    profileLoaded = false;
    setStatus('Loading your profile...');

    try {
      const profileRef = db.collection('users').doc(user.uid);
      const snap = await profileRef.get();

      if (snap.exists) {
        const data = snap.data();
        console.log('✅ Profile loaded:', data);
        profileLoaded = true;
        showDashboard(data.role || 'driver');
      } else {
        console.log('⚠️ No profile doc — defaulting to driver');
        profileLoaded = true;
        showDashboard('driver');
      }
    } catch (err) {
      console.warn('⚠️ Profile load error:', err.code);
      setStatus('Waiting for database...');
      setTimeout(() => {
        if (!profileLoaded) {
          console.log('⏰ Fallback — showing driver portal');
          showDashboard('driver');
        }
      }, 8000);
    }
  }

  firebase.auth().onAuthStateChanged(async (user) => {
    console.log('🔐 Auth state:', user ? 'Signed in' : 'Signed out');
    
    if (user) {
      currentUser = user;
      showPage(pageLoading);
      setStatus('✅ Signed in — loading profile...');
      await loadProfile(user);
    } else {
      currentUser = null;
      profileLoaded = false;
      showPage(pageSignIn);
    }
  });

  window.handleSignIn = async function () {
    const email = document.getElementById('si-email').value.trim();
    const pass = document.getElementById('si-password').value;
    if (!email || !pass) return alert('Please fill in all fields');

    try {
      showPage(pageLoading);
      setStatus('Signing you in...');
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (err) {
      console.error('❌ Sign in error:', err);
      alert('Sign in failed: ' + err.message);
      showPage(pageSignIn);
    }
  };

  window.handleCompanyRegister = async function () {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-password').value;
    if (!name || !email || !pass) return alert('Please fill in all fields');

    try {
      showPage(pageLoading);
      setStatus('Creating company account...');
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      
      await db.collection('users').doc(cred.user.uid).set({
        name: name,
        email: email,
        role: 'company',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (err) {
      console.error('❌ Company register error:', err);
      alert('Registration failed: ' + err.message);
      showPage(pageRegister);
    }
  };

  window.handleDriverRegister = async function () {
    const name = document.getElementById('dr-name').value.trim();
    const email = document.getElementById('dr-email').value.trim();
    const pass = document.getElementById('dr-password').value;
    if (!name || !email || !pass) return alert('Please fill in all fields');

    try {
      showPage(pageLoading);
      setStatus('Creating driver account...');
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      
      await db.collection('users').doc(cred.user.uid).set({
        name: name,
        email: email,
        role: 'driver',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (err) {
      console.error('❌ Driver register error:', err);
      alert('Registration failed: ' + err.message);
      showPage(pageRegister);
    }
  };

  window.handleSignOut = async function () {
    await auth.signOut();
    currentUser = null;
    profileLoaded = false;
  };

  window.showRegister = () => showPage(pageRegister);
  window.showSignIn = () => showPage(pageSignIn);
</script>
</body>
</html>
