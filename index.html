<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSD Solutions — HGV & Logistics Services</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    :root {
      --primary: #1a365d; --accent: #2e8b57; --danger: #dc3545;
      --warning: #f59e0b; --info: #3b82f6; --light: #f5f7fa;
      --card: #ffffff; --text: #333333; --muted: #6b7280;
      --border: #e5e7eb;
    }
    body { background: var(--light); min-height: 100vh; color: var(--text); }
    .page { display: none; min-height: 100vh; }
    .active { display: block !important; }

    /* Auth Pages */
    .container { max-width: 440px; margin: 0 auto; padding: 40px 24px; }
    .logo { text-align: center; margin-bottom: 40px; }
    .logo h1 { font-size: 28px; color: var(--primary); margin-bottom: 4px; }
    .logo p { color: var(--muted); font-size: 15px; }
    h2 { font-size: 22px; color: var(--primary); margin-bottom: 24px; text-align: center; }
    h3 { font-size: 16px; color: var(--primary); margin: 24px 0 10px; }
    input, select, textarea {
      width: 100%; padding: 14px 16px; margin-bottom: 14px;
      border: 1px solid var(--border); border-radius: 8px; font-size: 16px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,54,93,0.1);
    }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; margin-bottom: 12px; }
    .btn-accent { background: var(--accent); color: white; margin-bottom: 12px; }
    .btn-danger { background: var(--danger); color: white; margin-top: 20px; }
    .btn-warning { background: var(--warning); color: #1f2937; margin-bottom: 12px; }
    .btn-sm { width: auto; padding: 8px 16px; font-size: 14px; }
    .link-row { text-align: center; margin-top: 20px; font-size: 15px; }
    a { color: var(--primary); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .status { text-align: center; margin-top: 30px; color: var(--muted); font-size: 15px; }

    /* Dashboard Layout */
    .dash-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .dash-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    .dash-header h1 { font-size: 24px; color: var(--primary); }
    .dash-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .dash-nav button {
      width: auto; padding: 10px 16px; background: white; color: var(--text);
      border: 1px solid var(--border); font-size: 14px; margin: 0;
    }
    .dash-nav button.active {
      background: var(--primary); color: white; border-color: var(--primary);
    }
    .dash-content { animation: fadeIn 0.3s; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    /* Cards & Grids */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card {
      background: white; padding: 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card h3 { margin: 0 0 8px; font-size: 18px; }
    .card p { color: var(--muted); font-size: 14px; }

    /* Forms & Lists */
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    .checklist-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .checklist-item input[type="checkbox"] { width: auto; margin: 0; }
    .defect-box { background: #fef3c7; padding: 16px; border-radius: 8px; margin: 12px 0; }
    .photo-preview {
      width: 80px; height: 80px; object-fit: cover; border-radius: 6px;
      margin: 4px; border: 1px solid var(--border);
    }

    /* Calendar */
    .cal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    }
    .cal-day {
      aspect-ratio: 1; padding: 6px; border-radius: 6px;
      background: white; border: 1px solid var(--border);
      min-height: 70px; cursor: pointer;
    }
    .cal-day:hover { background: #f0f4f8; }
    .cal-day.today { border-color: var(--primary); border-width: 2px; }
    .cal-label { font-size: 11px; padding: 2px 4px; border-radius: 3px; margin-top: 2px; }
    .key-box { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .key-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .key-swatch { width: 14px; height: 14px; border-radius: 3px; }
    .avail { background: #d1fae5; }
    .unavail { background: #fee2e2; }
    .booked { background: #dbeafe; }

    /* Work Cards */
    .work-card { border-left: 4px solid var(--accent); }
    .work-card.closed { opacity: 0.6; }

    /* Utilities */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-20 { margin-top: 20px; }
    .mb-20 { margin-bottom: 20px; }
    .alert { padding: 12px 16px; border-radius: 8px; margin: 16px 0; }
    .alert-info { background: #e0f2fe; color: #075985; }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-warning { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

<!-- ============== SIGN IN ============== -->
<div id="page-signin" class="page active">
  <div class="container">
    <div class="logo">
      <h1>LSD Solutions</h1>
      <p>HGV & Logistics Services</p>
    </div>
    <h2>Sign In</h2>
    <input type="email" id="si-email" placeholder="Email address" />
    <input type="password" id="si-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleSignIn()">Sign In</button>
    <div class="link-row">
      Don't have an account? <a href="#" onclick="showPage('register'); return false;">Register here</a>
    </div>
  </div>
</div>

<!-- ============== REGISTER ============== -->
<div id="page-register" class="page">
  <div class="container">
    <div class="logo">
      <h1>LSD Solutions</h1>
    </div>
    <h2>Create Account</h2>

    <h3>Register as a Company</h3>
    <input type="text" id="reg-name" placeholder="Company name" />
    <input type="email" id="reg-email" placeholder="Email address" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleCompanyRegister()">Register as Company</button>

    <h3>Register as a Driver</h3>
    <input type="text" id="dr-name" placeholder="Your full name" />
    <input type="email" id="dr-email" placeholder="Email address" />
    <input type="password" id="dr-password" placeholder="Password" />
    <button class="btn-accent" onclick="handleDriverRegister()">Register as Driver</button>

    <div class="link-row">
      <a href="#" onclick="showPage('signin'); return false;">← Back to Sign In</a>
    </div>
  </div>
</div>

<!-- ============== LOADING ============== -->
<div id="page-loading" class="page">
  <div class="container" style="text-align: center; padding-top: 80px;">
    <h2>Loading...</h2>
    <p id="status-text" class="status">Checking session...</p>
  </div>
</div>

<!-- ============== DASHBOARD ============== -->
<div id="page-dashboard" class="page">
  <div class="dash-container">
    <div class="dash-header">
      <div>
        <h1 id="dash-title">Dashboard</h1>
        <p id="dash-subtitle" style="color: var(--muted); font-size: 14px;">Welcome</p>
      </div>
      <button class="btn-sm btn-danger" onclick="handleSignOut()">Sign Out</button>
    </div>

    <!-- Navigation -->
    <div class="dash-nav" id="dash-nav"></div>

    <!-- Content Area -->
    <div class="dash-content" id="dash-content"></div>
  </div>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  // ===== CONFIG =====
  const firebaseConfig = {
    apiKey: "AIzaSyD1futajZiZd79r08a8TJHAMfgtpPPk0rk",
    authDomain: "lsd-solutions.firebaseapp.com",
    projectId: "lsd-solutions",
    storageBucket: "lsd-solutions.firebasestorage.app",
    messagingSenderId: "833767217116",
    appId: "1:833767217116:web:b29188de76b5778a086119",
    measurementId: "G-7YF4T8BBPT"
  };

  // ===== INIT =====
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let userProfile = null;
  let authChecked = false; // Prevents auto-redirect before user chooses

  // Calendar state
  let calDate = new Date();
  let calView = 'month';

  // ===== PAGE ROUTING =====
  const pages = {
    signin: document.getElementById('page-signin'),
    register: document.getElementById('page-register'),
    loading: document.getElementById('page-loading'),
    dashboard: document.getElementById('page-dashboard')
  };

  function showPage(name) {
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[name].classList.add('active');
  }

  function setStatus(msg) {
    console.log('📢', msg);
    document.getElementById('status-text').textContent = msg;
  }

  // ===== DASHBOARD NAVIGATION =====
  function getNavItems(role) {
    if (role === 'company') {
      return [
        { id: 'drivers', label: '🚛 Drivers' },
        { id: 'vehicles', label: '📋 Vehicles & Checks' },
        { id: 'work', label: '📤 Post Work' },
        { id: 'calendar', label: '📅 Calendar' },
        { id: 'docs', label: '📄 Documents' },
        { id: 'profile', label: '👤 Profile' }
      ];
    }
    return [
      { id: 'check', label: '✅ Vehicle Check' },
      { id: 'mychecks', label: '📋 My Checks' },
      { id: 'calendar', label: '📅 My Calendar' },
      { id: 'work', label: '🔍 Available Work' },
      { id: 'docs', label: '📄 My Documents' },
      { id: 'profile', label: '👤 My Profile' }
    ];
  }

  function renderNav(role) {
    const nav = document.getElementById('dash-nav');
    const items = getNavItems(role);
    nav.innerHTML = items.map(i =>
      `<button data-nav="${i.id}" onclick="switchTab('${i.id}')">${i.label}</button>`
    ).join('');
  }

  function switchTab(tabId) {
    document.querySelectorAll('.dash-nav button').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-nav="${tabId}"]`)?.classList.add('active');
    renderContent(tabId);
  }

  // ===== CONTENT RENDERERS =====
  function renderContent(tab) {
    const role = userProfile?.role || 'driver';
    const content = document.getElementById('dash-content');

    switch(tab) {
      // --- DRIVER TABS ---
      case 'check': content.innerHTML = renderVehicleCheck(); break;
      case 'mychecks': content.innerHTML = renderMyChecks(); break;
      case 'work': content.innerHTML = role==='company' ? renderCompanyWork() : renderAvailableWork(); break;
      case 'calendar': content.innerHTML = renderCalendar(); break;
      case 'docs': content.innerHTML = renderDocuments(); break;
      case 'profile': content.innerHTML = renderProfile(); break;
      // --- COMPANY TABS ---
      case 'drivers': content.innerHTML = renderCompanyDrivers(); break;
      case 'vehicles': content.innerHTML = renderCompanyVehicles(); break;
    }
  }

  // ===== VEHICLE WALKAROUND CHECK =====
  function renderVehicleCheck() {
    return `
      <h3>Daily Vehicle Walkaround Check</h3>
      <p style="color: var(--muted); margin-bottom: 20px;">Complete before starting your shift</p>
      
      <div class="form-group">
        <label>Vehicle Registration</label>
        <input type="text" id="vreg" placeholder="e.g. AB12 CDE" />
      </div>

      <h3>Checklist Items</h3>
      ${['Tyres & Wheels', 'Brakes', 'Lights & Indicators', 'Mirrors', 'Windscreen & Wipers', 
         'Fluid Levels (Oil, Coolant, Screenwash)', 'Fuel Caps & Security', 
         'Coupling / Fifth Wheel', 'Body & Exterior', 'Number Plates', 
         'Horns & Warning Devices', 'Tachograph Equipment', 'Fire Extinguisher & First Aid',
         'Load Security / Doors'].map(item => `
        <div class="checklist-item">
          <input type="checkbox" id="check-${item.replace(/\s+/g,'-')}" />
          <label for="check-${item.replace(/\s+/g,'-')}">${item}</label>
          <button class="btn-sm btn-warning" style="margin-left:auto; width:auto; padding:4px 8px; font-size:12px;" 
            onclick="showDefect('${item}')">Report Defect</button>
        </div>
      `).join('')}

      <div id="defect-form" class="hidden mt-20">
        <div class="defect-box">
          <h4>Report Defect</h4>
          <input type="text" id="defect-item" placeholder="Defect item" readonly style="background:#f3f4f6;" />
          <textarea id="defect-desc" rows="3" placeholder="Describe the issue in detail..." style="resize:none;"></textarea>
          
          <label>Severity</label>
          <select id="defect-severity">
            <option value="advisory">⚠️ Advisory — Monitor / Repair when convenient</option>
            <option value="major">🔴 Major — Needs immediate attention</option>
          </select>
          
          <label>Add Photos</label>
          <input type="file" id="defect-photos" accept="image/*" multiple onchange="previewPhotos(this)" />
          <div id="photo-previews"></div>
          
          <button class="btn-primary mt-20" onclick="saveDefect()">Save Defect</button>
          <button class="btn-sm" style="background:transparent; color:var(--muted);" onclick="hideDefect()">Cancel</button>
        </div>
      </div>

      <h3 style="margin-top:30px;">Other Defects</h3>
      <button class="btn-accent" onclick="showOtherDefect()">Add Any Other Defect</button>
      
      <button class="btn-primary mt-20" onclick="submitCheck()">✅ Submit Completed Check</button>
    `;
  }

  let currentDefectItem = null;
  function showDefect(item) {
    currentDefectItem = item;
    document.getElementById('defect-item').value = item;
    document.getElementById('defect-form').classList.remove('hidden');
    document.getElementById('defect-desc').focus();
  }
  function showOtherDefect() {
    currentDefectItem = 'Other Defect';
    document.getElementById('defect-item').value = '';
    document.getElementById('defect-form').classList.remove('hidden');
    document.getElementById('defect-item').placeholder = 'Enter defect name';
  }
  function hideDefect() {
    document.getElementById('defect-form').classList.add('hidden');
    document.getElementById('photo-previews').innerHTML = '';
    currentDefectItem = null;
  }
  function previewPhotos(input) {
    const container = document.getElementById('photo-previews');
    container.innerHTML = '';
    Array.from(input.files).forEach(f => {
      const reader = new FileReader();
      reader.onload = e => {
        container.innerHTML += `<img src="${e.target.result}" class="photo-preview" />`;
      };
      reader.readAsDataURL(f);
    });
  }
  async function saveDefect() {
    const item = document.getElementById('defect-item').value || 'Other';
    const desc = document.getElementById('defect-desc').value.trim();
    const severity = document.getElementById('defect-severity').value;
    
    if (!desc) return alert('Please describe the defect');
    
    await db.collection('defects').add({
      userId: currentUser.uid,
      item, description: desc, severity,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      photos: []
    });
    
    alert(`✅ Defect saved as ${severity.toUpperCase()}`);
    hideDefect();
  }
  async function submitCheck() {
    const reg = document.getElementById('vreg').value.trim() || 'Not Recorded';
    await db.collection('checks').add({
      userId: currentUser.uid,
      vehicleReg: reg,
      completedAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: 'submitted'
    });
    alert('✅ Walkaround check submitted — Thank you');
    renderContent('check');
  }

  // ===== MY CHECKS HISTORY =====
  function renderMyChecks() {
    return `
      <h3>My Recent Checks</h3>
      <p class="alert alert-info">Your submitted checks and defects will appear here</p>
      <div id="checks-list">
        <p class="text-center" style="color:var(--muted); padding:20px;">Loading history...</p>
      </div>
    `;
  }

  // ===== CALENDAR =====
  function renderCalendar() {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const firstDay = new Date(y,m,1).getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();

    return `
      <h3>My Calendar</h3>
      <div class="key-box">
        <div class="key-item"><span class="key-swatch avail"></span> Available</div>
        <div class="key-item"><span class="key-swatch unavail"></span> Unavailable</div>
        <div class="key-item"><span class="key-swatch booked"></span> Work Booked</div>
      </div>
      
      <div class="cal-header">
        <button class="btn-sm" onclick="changeCal(-1)">←</button>
        <span style="font-weight:600;">${mNames[m]} ${y}</span>
        <button class="btn-sm" onclick="changeCal(1)">→</button>
        <div style="margin-left:auto; display:flex; gap:4px;">
          <button class="btn-sm" onclick="calView='day'; renderContent('calendar')">Day</button>
          <button class="btn-sm" onclick="calView='week'; renderContent('calendar')">Week</button>
          <button class="btn-sm" onclick="calView='month'; renderContent('calendar')">Month</button>
        </div>
      </div>
      
      <div class="cal-grid">
        ${days.map(d=>`<div style="text-align:center; font-weight:600; padding:8px; font-size:13px;">${d}</div>`).join('')}
        ${Array(firstDay).fill('').map(()=>'<div></div>').join('')}
        ${Array.from({length:daysInMonth}, (_,i) => {
          const d = i+1;
          const isToday = new Date().toDateString() === new Date(y,m,d).toDateString();
          return `<div class="cal-day ${isToday?'today':''}" onclick="setAvail('${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}')">
            <strong>${d}</strong>
            <div class="cal-label avail">Avail</div>
          </div>`;
        }).join('')}
      </div>
    `;
  }
  function changeCal(dir) {
    calDate.setMonth(calDate.getMonth()+dir);
    renderContent('calendar');
  }
  function setAvail(dateStr) {
    const choice = prompt(`Set status for ${dateStr}:\n- available\n- unavailable\n- booked`);
    if (!choice) return;
    db.collection('availability').doc(`${currentUser.uid}_${dateStr}`).set({
      userId: currentUser.uid, date: dateStr, status: choice
    }, {merge:true}).then(() => {
      alert('✅ Updated');
      renderContent('calendar');
    });
  }

  // ===== AVAILABLE WORK (Driver) =====
  function renderAvailableWork() {
    return `
      <h3>Available Work</h3>
      <p class="alert alert-info">Jobs posted by companies looking for drivers</p>
      <div id="work-list">
        <p class="text-center" style="color:var(--muted); padding:20px;">Loading jobs...</p>
      </div>
    `;
  }

  // ===== POST WORK (Company) =====
  function renderCompanyWork() {
    return `
      <h3>Post New Work</h3>
      <div class="form-group">
        <label>Job Title / Route</label>
        <input type="text" id="job-title" placeholder="e.g. Manchester — Southampton" />
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="job-date" />
      </div>
      <div class="form-group">
        <label>Start Time</label>
        <input type="time" id="job-start" />
      </div>
      <div class="form-group">
        <label>End Time</label>
        <input type="time" id="job-end" />
      </div>
      <div class="form-group">
        <label>Rate / Pay (£)</label>
        <input type="text" id="job-pay" placeholder="e.g. 180" />
      </div>
      <div class="form-group">
        <label>Additional Details</label>
        <textarea id="job-desc" rows="3" placeholder="Vehicle type, loads, requirements..."></textarea>
      </div>
      <button class="btn-primary" onclick="postJob()">📤 Publish Job</button>
      <h3 style="margin-top:30px;">Your Posted Jobs</h3>
      <div id="posted-list"></div>
    `;
  }
  async function postJob() {
    await db.collection('jobs').add({
      companyId: currentUser.uid,
      companyName: userProfile.name,
      title: document.getElementById('job-title').value,
      date: document.getElementById('job-date').value,
      startTime: document.getElementById('job-start').value,
      endTime: document.getElementById('job-end').value,
      pay: document.getElementById('job-pay').value,
      description: document.getElementById('job-desc').value,
      status: 'open',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert('✅ Job posted — visible to drivers');
    renderContent('work');
  }

  // ===== DOCUMENTS =====
  function renderDocuments() {
    const docs = userProfile?.role==='company' 
      ? ['Insurance Certificate', 'Operator Licence', 'Vehicle Discs', 'Policies & Procedures']
      : ['Driving Licence', 'CPC Card', 'Digital Tacho Card', 'Tachograph Infringements', 'Medical Certificate'];
    return `
      <h3>${userProfile?.role==='company'?'Company':'My'} Documents</h3>
      <p class="alert alert-info">Upload and store all your legal documentation</p>
      <div class="grid">
        ${docs.map(d => `
          <div class="card" onclick="uploadDoc('${d}')">
            <h3>📄 ${d}</h3>
            <p>Click to upload / view</p>
          </div>
        `).join('')}
      </div>
    `;
  }
  function uploadDoc(name) {
    alert(`Upload interface for: ${name}\n\nReady to connect to storage — working on it!`);
  }

  // ===== PROFILE =====
  function renderProfile() {
    return `
      <h3>My Profile</h3>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="p-name" value="${userProfile?.name||''}" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="p-email" value="${currentUser?.email||''}" readonly style="background:#f3f4f6;" />
      </div>
      <div class="form-group">
        <label>Account Type</label>
        <input value="${userProfile?.role==='company'?'🏢 Company':'🚛 Driver'}" readonly style="background:#f3f4f6;" />
      </div>
      <button class="btn-primary" onclick="saveProfile()">💾 Save Changes</button>
    `;
  }
  async function saveProfile() {
    await db.collection('users').doc(currentUser.uid).update({
      name: document.getElementById('p-name').value
    });
    userProfile.name = document.getElementById('p-name').value;
    alert('✅ Profile updated');
  }

  // ===== COMPANY ONLY =====
  function renderCompanyDrivers() {
    return `<h3>Driver Management</h3><p class="alert alert-info">View and manage your approved drivers</p>`;
  }
  function renderCompanyVehicles() {
    return `<h3>Fleet & Checks</h3><p class="alert alert-info">Vehicle list and completed walkarounds</p>`;
  }

  // ===== AUTH HANDLERS =====
  async function loadProfileData(uid) {
    const snap = await db.collection('users').doc(uid).get();
    if (snap.exists) return snap.data();
    return { role: 'driver', name: 'User' };
  }

  firebase.auth().onAuthStateChanged(async (user) => {
    authChecked = true;
    
    // ⭐ KEY FIX: Always show sign-in page first
    if (!user) {
      showPage('signin');
      return;
    }

    // Only proceed if actually signed in
    showPage('loading');
    setStatus('Loading your profile...');
    
    currentUser = user;
    userProfile = await loadProfileData(user.uid);
    
    // Update dashboard
    document.getElementById('dash-title').textContent = 
      userProfile.role==='company' ? '🏢 Company Portal' : '🚛 Driver Portal';
    document.getElementById('dash-subtitle').textContent = `Welcome, ${userProfile.name}`;
    
    renderNav(userProfile.role);
    showPage('dashboard');
    
    // Auto-select first tab
    const firstTab = getNavItems(userProfile.role)[0].id;
    switchTab(firstTab);
  });

  window.handleSignIn = async function () {
    const email = document.getElementById('si-email').value.trim();
    const pass = document.getElementById('si-password').value;
    if (!email || !pass) return alert('Please fill in all fields');
    try {
      showPage('loading');
      setStatus('Signing you in...');
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (err) {
      alert('Sign in failed: ' + err.message);
      showPage('signin');
    }
  };

  window.handleCompanyRegister = async function () {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-password').value;
    if (!name || !email || !pass) return alert('Please fill in all fields');
    try {
      showPage('loading');
      setStatus('Creating company account...');
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await db.collection('users').doc(cred.user.uid).set({
        name, email, role: 'company',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (err) {
      alert('Registration failed: ' + err.message);
      showPage('register');
    }
  };

  window.handleDriverRegister = async function () {
    const name = document.getElementById('dr-name').value.trim();
    const email = document.getElementById('dr-email').value.trim();
    const pass = document.getElementById('dr-password').value;
    if (!name || !email || !pass) return alert('Please fill in all fields');
    try {
      showPage('loading');
      setStatus('Creating driver account...');
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await db.collection('users').doc(cred.user.uid).set({
        name, email, role: 'driver',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (err) {
      alert('Registration failed: ' + err.message);
      showPage('register');
    }
  };

  window.handleSignOut = async function () {
    await auth.signOut();
    currentUser = null;
    userProfile = null;
    showPage('signin');
  };

  // Expose globally
  window.switchTab = switchTab;
  window.showPage = showPage;
  window.changeCal = changeCal;
  window.setAvail = setAvail;
  window.showDefect = showDefect;
  window.showOtherDefect = showOtherDefect;
  window.hideDefect = hideDefect;
  window.previewPhotos = previewPhotos;
  window.saveDefect = saveDefect;
  window.submitCheck = submitCheck;
  window.postJob = postJob;
  window.uploadDoc = uploadDoc;
  window.saveProfile = saveProfile;
</script>
</body>
</html>
