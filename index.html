<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSD Solutions — HGV & Logistics Services</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    :root {
      --primary: #1a365d; --accent: #2e8b57; --danger: #dc3545;
      --warning: #f59e0b; --info: #3b82f6; --light: #f5f7fa;
      --card: #ffffff; --text: #333333; --muted: #6b7280;
      --border: #e5e7eb;
    }
    body { background: var(--light); min-height: 100vh; color: var(--text); }
    .page { display: none; min-height: 100vh; }
    .active { display: block !important; }

    /* Auth Pages */
    .container { max-width: 440px; margin: 0 auto; padding: 40px 24px; }
    .logo { text-align: center; margin-bottom: 40px; }
    .logo h1 { font-size: 28px; color: var(--primary); margin-bottom: 4px; }
    .logo p { color: var(--muted); font-size: 15px; }
    h2 { font-size: 22px; color: var(--primary); margin-bottom: 24px; text-align: center; }
    h3 { font-size: 16px; color: var(--primary); margin: 24px 0 10px; }
    input, select, textarea {
      width: 100%; padding: 14px 16px; margin-bottom: 14px;
      border: 1px solid var(--border); border-radius: 8px; font-size: 16px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,54,93,0.1);
    }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; margin-bottom: 12px; }
    .btn-accent { background: var(--accent); color: white; margin-bottom: 12px; }
    .btn-danger { background: var(--danger); color: white; margin-top: 20px; }
    .btn-warning { background: var(--warning); color: #1f2937; margin-bottom: 12px; }
    .btn-sm { width: auto; padding: 8px 16px; font-size: 14px; }
    .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); }
    .link-row { text-align: center; margin-top: 20px; font-size: 15px; }
    a { color: var(--primary); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .status { text-align: center; margin-top: 30px; color: var(--muted); font-size: 15px; }

    /* Dashboard Layout */
    .dash-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .dash-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    .dash-header h1 { font-size: 24px; color: var(--primary); }
    .dash-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .dash-nav button {
      width: auto; padding: 10px 16px; background: white; color: var(--text);
      border: 1px solid var(--border); font-size: 14px; margin: 0;
    }
    .dash-nav button.active {
      background: var(--primary); color: white; border-color: var(--primary);
    }
    .dash-content { animation: fadeIn 0.3s; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    /* Cards & Grids */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card {
      background: white; padding: 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card h3 { margin: 0 0 8px; font-size: 18px; }
    .card p { color: var(--muted); font-size: 14px; }

    /* Forms & Lists */
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    .checklist-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .checklist-item input[type="checkbox"] { width: auto; margin: 0; }
    .defect-box { background: #fef3c7; padding: 16px; border-radius: 8px; margin: 12px 0; }
    .photo-preview {
      width: 100px; height: 100px; object-fit: cover; border-radius: 6px;
      margin: 8px 8px 0 0; border: 1px solid var(--border);
    }
    .item-card {
      background: white; padding: 16px; border-radius: 10px; margin-bottom: 12px;
      border-left: 4px solid var(--accent);
    }
    .item-card.major { border-left-color: var(--danger); }
    .item-card.advisory { border-left-color: var(--warning); }
    .item-card.info { border-left-color: var(--info); }
    .thumb-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .thumb-grid img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 4px;
      cursor: pointer; border: 1px solid var(--border);
    }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-blue { background: #dbeafe; color: #1e40af; }

    /* Calendar */
    .cal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    }
    .cal-day {
      aspect-ratio: 1; padding: 6px; border-radius: 6px;
      background: white; border: 1px solid var(--border);
      min-height: 70px; cursor: pointer;
    }
    .cal-day:hover { background: #f0f4f8; }
    .cal-day.today { border-color: var(--primary); border-width: 2px; }
    .key-box { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .key-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .key-swatch { width: 14px; height: 14px; border-radius: 3px; }
    .avail-bg { background: #d1fae5; }
    .unavail-bg { background: #fee2e2; }
    .booked-bg { background: #dbeafe; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: var(--light); font-weight: 600; color: var(--primary); }
    tr:hover { background: #f9fafb; }

    /* Utilities */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .mt-20 { margin-top: 20px; }
    .mb-20 { margin-bottom: 20px; }
    .alert { padding: 12px 16px; border-radius: 8px; margin: 16px 0; }
    .alert-info { background: #e0f2fe; color: #075985; }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-warning { background: #fef3c7; color: #92400e; }
    .alert-danger { background: #fee2e2; color: #991b1b; }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    .upload-status { font-size: 13px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>

<!-- ============== SIGN IN ============== -->
<div id="page-signin" class="page active">
  <div class="container">
    <div class="logo">
      <h1>LSD Solutions</h1>
      <p>HGV & Logistics Services</p>
    </div>
    <h2>Sign In</h2>
    <input type="email" id="si-email" placeholder="Email address" />
    <input type="password" id="si-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleSignIn()">Sign In</button>
    <div class="link-row">
      Don't have an account? <a href="#" onclick="showPage('register'); return false;">Register here</a>
    </div>
  </div>
</div>

<!-- ============== REGISTER ============== -->
<div id="page-register" class="page">
  <div class="container">
    <div class="logo">
      <h1>LSD Solutions</h1>
    </div>
    <h2>Create Account</h2>

    <h3>Register as a Company</h3>
    <input type="text" id="reg-name" placeholder="Company name" />
    <input type="email" id="reg-email" placeholder="Email address" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button class="btn-primary" onclick="handleCompanyRegister()">Register as Company</button>

    <h3>Register as a Driver</h3>
    <input type="text" id="dr-name" placeholder="Your full name" />
    <input type="email" id="dr-email" placeholder="Email address" />
    <input type="password" id="dr-password" placeholder="Password" />
    <button class="btn-accent" onclick="handleDriverRegister()">Register as Driver</button>

    <div class="link-row">
      <a href="#" onclick="showPage('signin'); return false;">← Back to Sign In</a>
    </div>
  </div>
</div>

<!-- ============== LOADING ============== -->
<div id="page-loading" class="page">
  <div class="container" style="text-align: center; padding-top: 80px;">
    <h2>Loading...</h2>
    <p id="status-text" class="status">Checking session...</p>
  </div>
</div>

<!-- ============== DASHBOARD ============== -->
<div id="page-dashboard" class="page">
  <div class="dash-container">
    <div class="dash-header">
      <div>
        <h1 id="dash-title">Dashboard</h1>
        <p id="dash-subtitle" style="color: var(--muted); font-size: 14px;">Welcome</p>
      </div>
      <button class="btn-sm btn-danger" onclick="handleSignOut()">Sign Out</button>
    </div>
    <div class="dash-nav" id="dash-nav"></div>
    <div class="dash-content" id="dash-content"></div>
  </div>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
  // ===== CONFIG =====
  const firebaseConfig = {
    apiKey: "AIzaSyD1futajZiZd79r08a8TJHAMfgtpPPk0rk",
    authDomain: "lsd-solutions.firebaseapp.com",
    projectId: "lsd-solutions",
    storageBucket: "lsd-solutions.appspot.com",
    messagingSenderId: "833767217116",
    appId: "1:833767217116:web:b29188de76b5778a086119",
    measurementId: "G-7YF4T8BBPT"
  };

  // ===== INIT =====
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  let currentUser = null;
  let userProfile = null;
  let authChecked = false;

  // Calendar state
  let calDate = new Date();
  let availData = {};
  let jobsData = [];
  let checksData = [];
  let defectsData = [];
  let usersData = [];
  let vehiclesData = [];

  // ===== PAGE ROUTING =====
  const pages = {
    signin: document.getElementById('page-signin'),
    register: document.getElementById('page-register'),
    loading: document.getElementById('page-loading'),
    dashboard: document.getElementById('page-dashboard')
  };

  function showPage(name) {
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[name].classList.add('active');
  }

  function setStatus(msg) {
    console.log('📢', msg);
    document.getElementById('status-text').textContent = msg;
  }

  // ===== DASHBOARD NAVIGATION =====
  function getNavItems(role) {
    if (role === 'company') {
      return [
        { id: 'drivers', label: '👥 Drivers' },
        { id: 'vehicles', label: '🚛 Vehicle Checks' },
        { id: 'work', label: '📤 Post Work' },
        { id: 'calendar', label: '📅 Calendar' },
        { id: 'docs', label: '📄 Documents' },
        { id: 'profile', label: '👤 Profile' }
      ];
    }
    return [
      { id: 'check', label: '✅ Vehicle Check' },
      { id: 'mychecks', label: '📋 My Checks' },
      { id: 'calendar', label: '📅 My Calendar' },
      { id: 'work', label: '🔍 Available Work' },
      { id: 'docs', label: '📄 My Documents' },
      { id: 'profile', label: '👤 My Profile' }
    ];
  }

  function renderNav(role) {
    const nav = document.getElementById('dash-nav');
    const items = getNavItems(role);
    nav.innerHTML = items.map(i =>
      `<button data-nav="${i.id}" onclick="switchTab('${i.id}')">${i.label}</button>`
    ).join('');
  }

  function switchTab(tabId) {
    document.querySelectorAll('.dash-nav button').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-nav="${tabId}"]`)?.classList.add('active');
    renderContent(tabId);
  }

  // ===== UPLOAD PHOTO TO STORAGE =====
  async function uploadDefectPhoto(file, userId) {
    const timestamp = Date.now();
    const ref = storage.ref(`defects/${userId}/${timestamp}_${file.name}`);
    await ref.put(file);
    return await ref.getDownloadURL();
  }

  // ===== LOAD ALL DATA FROM FIRESTORE =====
  async function loadAllData() {
    if (!currentUser) return;

    const availSnap = await db.collection('availability')
      .where('userId', '==', currentUser.uid)
      .get();
    availData = {};
    availSnap.forEach(doc => { availData[doc.data().date] = doc.data(); });

    const checksSnap = await db.collection('checks')
      .orderBy('completedAt', 'desc')
      .limit(50)
      .get();
    checksData = checksSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const defectsSnap = await db.collection('defects')
      .orderBy('timestamp', 'desc')
      .limit(50)
      .get();
    defectsData = defectsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const jobsSnap = await db.collection('jobs')
      .orderBy('createdAt', 'desc')
      .limit(50)
      .get();
    jobsData = jobsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const usersSnap = await db.collection('users').limit(50).get();
    usersData = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const vehiclesSnap = await db.collection('vehicles').limit(50).get();
    vehiclesData = vehiclesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  // ===== CONTENT RENDERERS =====
  function renderContent(tab) {
    const role = userProfile?.role || 'driver';
    const content = document.getElementById('dash-content');

    switch(tab) {
      case 'check': content.innerHTML = renderVehicleCheck(); break;
      case 'mychecks': content.innerHTML = renderMyChecks(); break;
      case 'work': content.innerHTML = role==='company' ? renderCompanyWork() : renderAvailableWork(); break;
      case 'calendar': content.innerHTML = renderCalendar(); break;
      case 'docs': content.innerHTML = renderDocuments(); break;
      case 'profile': content.innerHTML = renderProfile(); break;
      case 'drivers': content.innerHTML = renderCompanyDrivers(); break;
      case 'vehicles': content.innerHTML = renderCompanyVehicles(); break;
    }
  }

  // ===== VEHICLE WALKAROUND CHECK (Driver) =====
  function renderVehicleCheck() {
    return `
      <h3>Daily Vehicle Walkaround Check</h3>
      <p style="color: var(--muted); margin-bottom: 20px;">Complete before starting your shift</p>
      
      <div class="form-group">
        <label>Vehicle Registration</label>
        <input type="text" id="vreg" placeholder="e.g. AB12 CDE" />
      </div>

      <h3>Checklist Items</h3>
      ${['Tyres & Wheels', 'Brakes', 'Lights & Indicators', 'Mirrors', 'Windscreen & Wipers', 
         'Fluid Levels (Oil, Coolant, Screenwash)', 'Fuel Caps & Security', 
         'Coupling / Fifth Wheel', 'Body & Exterior', 'Number Plates', 
         'Horns & Warning Devices', 'Tachograph Equipment', 'Fire Extinguisher & First Aid',
         'Load Security / Doors'].map(item => `
        <div class="checklist-item">
          <input type="checkbox" id="check-${item.replace(/\s+/g,'-')}" />
          <label for="check-${item.replace(/\s+/g,'-')}">${item}</label>
          <button class="btn-sm btn-warning" style="margin-left:auto; width:auto; padding:4px 8px; font-size:12px;" 
            onclick="showDefect('${item}')">Report Defect</button>
        </div>
      `).join('')}

      <div id="defect-form" class="hidden mt-20">
        <div class="defect-box">
          <h4>Report Defect</h4>
          <input type="text" id="defect-item" placeholder="Defect / Component" />
          <textarea id="defect-desc" rows="3" placeholder="Describe the issue in detail..." style="resize:none;"></textarea>
          
          <label>Severity</label>
          <select id="defect-severity">
            <option value="advisory">⚠️ Advisory — Monitor / Repair when convenient</option>
            <option value="major">🔴 Major — Needs immediate attention</option>
          </select>
          
          <label>Add Photos</label>
          <input type="file" id="defect-photos" accept="image/*" multiple onchange="showPhotoPreviews(this)" />
          <div id="photo-preview-area" class="thumb-grid"></div>
          
          <button class="btn-primary mt-20" id="save-defect-btn" onclick="saveDefect()">📸 Save Defect with Photos</button>
          <button class="btn-sm" style="background:transparent; color:var(--muted);" onclick="hideDefect()">Cancel</button>
        </div>
      </div>

      <h3 style="margin-top:30px;">Other Defects</h3>
      <button class="btn-accent" onclick="showOtherDefect()">Add Any Other Defect</button>
      
      <button class="btn-primary mt-20" onclick="submitCheck()">✅ Submit Completed Check</button>
    `;
  }

  let currentDefectItem = null;
  let selectedPhotoFiles = [];

  function showPhotoPreviews(input) {
    selectedPhotoFiles = Array.from(input.files);
    const area = document.getElementById('photo-preview-area');
    area.innerHTML = '';
    selectedPhotoFiles.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        area.innerHTML += `<img src="${e.target.result}" alt="Preview" />`;
      };
      reader.readAsDataURL(file);
    });
  }

  function showDefect(item) {
    currentDefectItem = item;
    selectedPhotoFiles = [];
    document.getElementById('defect-item').value = item;
    document.getElementById('photo-preview-area').innerHTML = '';
    document.getElementById('defect-form').classList.remove('hidden');
    document.getElementById('defect-desc').focus();
  }

  function showOtherDefect() {
    currentDefectItem = 'Other Defect';
    selectedPhotoFiles = [];
    document.getElementById('defect-item').value = '';
    document.getElementById('defect-item').placeholder = 'Enter defect name';
    document.getElementById('photo-preview-area').innerHTML = '';
    document.getElementById('defect-form').classList.remove('hidden');
    document.getElementById('defect-desc').focus();
  }

  function hideDefect() {
    document.getElementById('defect-form').classList.add('hidden');
    document.getElementById('photo-preview-area').innerHTML = '';
    selectedPhotoFiles = [];
    currentDefectItem = null;
  }

  async function saveDefect() {
    const item = document.getElementById('defect-item').value.trim() || 'Unspecified';
    const desc = document.getElementById('defect-desc').value.trim();
    const severity = document.getElementById('defect-severity').value;
    
    if (!desc) return alert('Please describe the defect');
    
    const btn = document.getElementById('save-defect-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Uploading photos...';

    const photoURLs = [];
    for (const file of selectedPhotoFiles) {
      const url = await uploadDefectPhoto(file, currentUser.uid);
      photoURLs.push(url);
    }

    await db.collection('defects').add({
      userId: currentUser.uid,
      userName: userProfile.name,
      item,
      description: desc,
      severity,
      photoURLs,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert(`✅ Defect saved — ${severity.toUpperCase()}\n${photoURLs.length} photo(s) uploaded`);
    hideDefect();
    btn.disabled = false;
    btn.textContent = '📸 Save Defect with Photos';
    await loadAllData();
    renderContent('mychecks');
  }

  async function submitCheck() {
    const reg = document.getElementById('vreg').value.trim() || 'Not Recorded';
    const checkedItems = [];
    document.querySelectorAll('.checklist-item input[type="checkbox"]').forEach(cb => {
      if (cb.checked) checkedItems.push(cb.id.replace('check-', '').replace(/-/g, ' '));
    });
    
    await db.collection('checks').add({
      userId: currentUser.uid,
      userName: userProfile.name,
      vehicleReg: reg,
      checkedItems,
      completedAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: 'submitted'
    });
    
    alert('✅ Walkaround check submitted — Thank you');
    renderContent('check');
  }

  // ===== MY CHECKS HISTORY (Driver) =====
  function renderMyChecks() {
    if (checksData.length === 0 && defectsData.length === 0) {
      return `<h3>My Checks & Defects</h3><p class="empty">No checks submitted yet. Complete your first vehicle check above.</p>`;
    }

    let html = `<h3>My Checks (Last 50)</h3>`;
    
    const myChecks = checksData.filter(c => c.userId === currentUser?.uid);
    const myDefects = defectsData.filter(d => d.userId === currentUser?.uid);

    if (myChecks.length === 0) {
      html += `<p class="empty">No checks submitted yet.</p>`;
    } else {
      myChecks.forEach(check => {
        const date = check.completedAt?.toDate ? check.completedAt.toDate().toLocaleString() : 'Recently';
        html += `
          <div class="item-card info">
            <strong>🚛 ${check.vehicleReg || 'Vehicle'}</strong>
            <p style="margin:4px 0; font-size:13px; color:var(--muted);">${date}</p>
            <p style="font-size:13px;">${check.checkedItems?.length || 0} items checked</p>
          </div>
        `;
      });
    }

    html += `<h3 style="margin-top:30px;">Reported Defects</h3>`;
    if (myDefects.length === 0) {
      html += `<p class="empty">No defects reported — all good! ✅</p>`;
    } else {
      myDefects.forEach(d => {
        const date = d.timestamp?.toDate ? d.timestamp.toDate().toLocaleString() : 'Recently';
        html += `
          <div class="item-card ${d.severity === 'major' ? 'major' : 'advisory'}">
            <strong>${d.severity === 'major' ? '🔴' : '⚠️'} ${d.item}</strong>
            <p style="margin:4px 0; font-size:13px; color:var(--muted);">${date}</p>
            <p style="font-size:14px; margin-top:8px;">${d.description}</p>
            ${d.photoURLs?.length > 0 ? `
              <div class="thumb-grid">
                ${d.photoURLs.map(url => `<a href="${url}" target="_blank"><img src="${url}" alt="Defect photo" /></a>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      });
    }
    return html;
  }

  // ===== COMPANY: DRIVERS MANAGEMENT =====
  function renderCompanyDrivers() {
    const drivers = usersData.filter(u => u.role === 'driver');
    
    return `

  // ===== CALENDAR =====
  function renderCalendar() {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const firstDay = new Date(y,m,1).getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();

    return `
      <h3>${userProfile?.role==='company' ? 'Company Calendar Overview' : 'My Calendar'}</h3>
      <div class="key-box">
        <div class="key-item"><span class="key-swatch avail-bg"></span> Available</div>
        <div class="key-item"><span class="key-swatch unavail-bg"></span> Unavailable</div>
        <div class="key-item"><span class="key-swatch booked-bg"></span> Work Booked</div>
      </div>
      
      <div class="cal-header">
        <button class="btn-sm" onclick="changeCal(-1)">←</button>
        <span style="font-weight:600;">${mNames[m]} ${y}</span>
        <button class="btn-sm" onclick="changeCal(1)">→</button>
      </div>
      
      <div class="cal-grid">
        ${days.map(d=>`<div style="text-align:center; font-weight:600; padding:8px; font-size:13px;">${d}</div>`).join('')}
        ${Array(firstDay).fill('').map(()=>'<div></div>').join('')}
        ${Array.from({length:daysInMonth}, (_,i) => {
          const d = i+1;
          const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const status = availData[dateStr]?.status || null;
          const isToday = new Date().toDateString() === new Date(y,m,d).toDateString();
          let bgClass = '';
          if (status === 'available') bgClass = 'avail-bg';
          else if (status === 'unavailable') bgClass = 'unavail-bg';
          else if (status === 'booked') bgClass = 'booked-bg';
          
          return `<div class="cal-day ${isToday?'today':''} ${bgClass}" ${userProfile?.role==='driver' ? `onclick="setAvail('${dateStr}')"` : ''}>
            <strong>${d}</strong>
            ${status ? `<div style="font-size:10px; margin-top:4px;">${status}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
      ${userProfile?.role==='driver' ? 
        '<p style="margin-top:16px; font-size:13px; color:var(--muted);">Click any day to set your availability status</p>' : 
        '<p style="margin-top:16px; font-size:13px; color:var(--muted);">Driver availability will appear here</p>'
      }
    `;
  }
  window.changeCal = function(dir) {
    calDate.setMonth(calDate.getMonth()+dir);
    renderContent('calendar');
  };
  window.setAvail = async function(dateStr) {
    const choice = prompt(`Set status for ${dateStr}:\n\n- available\n- unavailable\n- booked\n\nType one of the above:`);
    if (!choice) return;
    const valid = ['available','unavailable','booked'];
    if (!valid.includes(choice)) return alert('Please enter: available, unavailable, or booked');
    
    await db.collection('availability').doc(`${currentUser.uid}_${dateStr}`).set({
      userId: currentUser.uid,
      date: dateStr,
      status: choice
    }, {merge:true});
    
    await loadAllData();
    renderContent('calendar');
    alert(`✅ Status set to: ${choice}`);
  };
